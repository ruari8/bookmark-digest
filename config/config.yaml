# Bookmark Digest Configuration

# Output settings
output:
  directory: "../"  # Parent learn/ folder
  format: "markdown"  # markdown, pdf, or both
  filename_template: "weekly-digest-{date}.md"

# AI Research settings
ai:
  provider: "claude_cli"  # claude_cli (Claude Code subscription), anthropic (API), or openai (API)
  model: "opus"  # Opus 4.6 (via Claude Code alias)
  # For complex research, use a more capable model
  research_model: "opus"
  max_tokens: 8192
  # Claude Code CLI settings (safer defaults for cron):
  # Tools:
  # - "WebSearch,WebFetch": recommended for unattended research (web-only discovery)
  # - "": disables all tools (bookmark-only; no web research)
  # - null: omit --tools flag (Claude Code default tool set; may include powerful tools like Bash/Read/Edit)
  # - "default": explicit default tool set (typically includes Bash/Read/Edit)
  claude_cli_tools: "WebSearch,WebFetch"
  # Permission mode:
  # - "bypassPermissions": unattended (recommended when using web-only tools)
  # - null: don't pass --permission-mode at all
  claude_cli_permission_mode: "bypassPermissions"
  claude_cli_dangerously_skip_permissions: false

# Content extraction
parser:
  # Maximum articles to extract per run
  max_articles: 50
  # Timeout for fetching URLs (seconds)
  fetch_timeout: 30
  # Extract full thread for tweet replies
  extract_threads: true

# Scraper settings
scraper:
  # How many bookmarks to fetch per run (0 = all new since last run)
  max_bookmarks: 0
  # Only process bookmarks newer than this many days (0 = no limit)
  days_limit: 7

# Audio settings (optional)
audio:
  enabled: false
  provider: "openai"  # openai or elevenlabs
  voice: "alloy"  # OpenAI voices: alloy, echo, fable, onyx, nova, shimmer
  output_format: "mp3"

# Email delivery settings
email:
  enabled: false
  provider: "gmail_smtp"
  from_address: "your-digest-bot@gmail.com"
  to_addresses:
    - "your-main-email@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_username_env: "GMAIL_SMTP_USERNAME"
  smtp_password_env: "GMAIL_SMTP_APP_PASSWORD"
  attach_preferred: "pdf"      # pdf | markdown
  attach_fallback: "markdown"  # markdown | none
  send_on_empty: false
  subject_prefix: "Bookmark Digest"

# Scheduling (for reference - actual scheduling done via launchd/cron)
schedule:
  day: "sunday"
  hour: 8
  minute: 0

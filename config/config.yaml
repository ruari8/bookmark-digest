# Bookmark Notes configuration

# Writer: Codex CLI, using the machine's `codex login` (ChatGPT subscription).
# Check which models the account can use with `codex debug models`.
ai:
  model: "gpt-6.1-sol"
  reasoning_effort: "medium"   # low | medium | high
  web_search: true             # live web search for deep dives on bookmarked items
  sandbox: "read-only"
  # Ignore ~/.codex/config.toml (auth still works) so personal config can't break the weekly run.
  ignore_user_config: true
  timeout_seconds: 1800

# Static site
blog:
  site_title: "Bookmark Notes"
  site_description: "Weekly notes from Ruari's X bookmarks"
  base_url: "https://bookmark.ruari.dev"
  state_path: "data/blog.sqlite3"
  content_dir: "content/posts"
  site_dir: "site"
  first_run_bookmarks: 10
  scan_limit: 50
  bird_command: "npx --yes @steipete/bird"
  include_author_chain: true
  max_linked_tweets: 15        # linked x.com posts fetched for extra context
  automatic_cover_image: false
  cache_remote_media: true
  max_cached_media_mb: 50

# Notification email (Resend). Also used to alert on a failed weekly run.
email:
  enabled: true
  # Switch to "Bookmark Notes <bookmarks@ruari.dev>" once ruari.dev is verified in Resend.
  from_address: "onboarding@resend.dev"
  to_addresses:
    - "ruaricraig1@gmail.com"
  resend_api_key_env: "RESEND_API_KEY"
  subject_prefix: "Bookmark Notes"
